name: Generated content quality tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMNIROUTE_API_KEY: unit-test-only
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --no-dev

      - name: Test Markdown fence parsing and Python code quality
        run: |
          uv run python tests/test_code_blocks.py
          uv run python tests/test_code_quality.py
          uv run python tests/test_algorithm_reviewer_evidence.py
          uv run python tests/test_flexible_english_publish.py
          uv run python tests/test_troubleshooting_safety_guidance.py
